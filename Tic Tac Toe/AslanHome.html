<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boter Kaas Eiren</title>
    <link rel="stylesheet" href="css/Aslan.css">
</head>

<body>

    <div class="grid-container">

        <header class="header-item">
            <h1 class="header-title">Welcome!</h1>
            <div class="guide-btn">
                <a href="Aslanguide.html" class="guide-link">Guide</a>
            </div>
        </header>

        <div class="text-item">
            <h2>Choose your mode</h2>
        </div>

        <main class="main-item">
            <section class="buttons">
                <button class="btn-friend">Play with a friend</button>
                <button class="btn-ai">Computer AI</button>
            </section>

            <section class="game hidden">

                <div class="game-layout">

                    <div class="player left">
                        <div class="player-name">PLAYER 1</div>
                        <div class="score">Score</div>
                    </div>

                    <div class="tictactoe-grid">
                        <div class="cell"></div>
                        <div class="cell"></div>
                        <div class="cell"></div>

                        <div class="cell"></div>
                        <div class="cell"></div>
                        <div class="cell"></div>

                        <div class="cell"></div>
                        <div class="cell"></div>
                        <div class="cell"></div>
                    </div>

                    <div class="player right">
                        <div class="player-name">PLAYER 2</div>
                        <div class="score">Score</div>
                    </div>

                    <div class="match-winner hidden">Match Winner:</div>
                    <button class="reset-btn">Reset Game</button>

                </div>

            </section>

        </main>

        <footer class="footer-item">
            PowerRangerSpellen.nl
        </footer>

    </div>

    <script src="js/AslanG.js" defer></script>
</body>

</html>
