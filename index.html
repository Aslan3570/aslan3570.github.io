<!doctype html>
<html lang="nl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welkom - Intro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: black;
            color: white;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        #intro-box {
            height: 100vh;
        }
        
        #welcomeText {
            font-size: 4rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">

    <div id="intro-box" class="d-flex flex-column justify-content-center align-items-center">
        <h1 id="welcomeText">Welkom</h1>
        <p class="text-secondary mt-3">Klik om te beginnen</p>
    </div>

    <script src="js/intro.js" defer></script>
</body>

</html>
